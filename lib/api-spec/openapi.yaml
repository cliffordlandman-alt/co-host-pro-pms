        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      properties:
        todayCheckIns:
          type: integer
        todayCheckOuts:
          type: integer
        occupiedUnits:
          type: integer
        availableUnits:
          type: integer
        cleaningPending:
          type: integer
        maintenanceOpen:
          type: integer
        paymentsPending:
          type: integer
        urgentIssues:
          type: integer
        totalRevenue:
          type: number
        totalProperties:
          type: integer
      required:
        - todayCheckIns
        - todayCheckOuts
        - occupiedUnits
        - availableUnits
        - cleaningPending
        - maintenanceOpen
        - paymentsPending
        - urgentIssues
        - totalRevenue
        - totalProperties

    Property:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        unitNumber:
          type: string
        building:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
        ownerId:
          type: ["integer", "null"]
        ownerName:
          type: ["string", "null"]
        bedroomType:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        airbnbIcalUrl:
          type: ["string", "null"]
        bookingComIcalUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - unitNumber
        - status
        - createdAt

    PropertyInput:
      type: object
      properties:
        name:
          type: string
        unitNumber:
          type: string
        building:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
        ownerId:
          type: ["integer", "null"]
        bedroomType:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        airbnbIcalUrl:
          type: ["string", "null"]
        bookingComIcalUrl:
          type: ["string", "null"]
      required:
        - name
        - unitNumber

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
        unitNumber:
          type: string
        building:
          type: ["string", "null"]
        area:
          type: ["string", "null"]
        ownerId:
          type: ["integer", "null"]
        bedroomType:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        airbnbIcalUrl:
          type: ["string", "null"]
        bookingComIcalUrl:
          type: ["string", "null"]

    Reservation:
      type: object
      properties:
        id:
          type: integer
        guestName:
          type: string
        platform:
          type: string
          enum: [airbnb, booking_com, direct]
        propertyId:
          type: integer
        propertyName:
          type: ["string", "null"]
        checkIn:
          type: string
        checkOut:
          type: string
        nights:
          type: integer
        revenue:
          type: number
        cleaningFee:
          type: ["number", "null"]
        balanceDue:
          type: ["number", "null"]
        paymentStatus:
          type: string
          enum: [pending, partial, paid]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]
        createdAt:
          type: string
      required:
        - id
        - guestName
        - platform
        - propertyId
        - checkIn
        - checkOut
        - nights
        - revenue
        - paymentStatus
        - status
        - createdAt

    ReservationInput:
      type: object
      properties:
        guestName:
          type: string
        platform:
          type: string
          enum: [airbnb, booking_com, direct]
        propertyId:
          type: integer
        checkIn:
          type: string
        checkOut:
          type: string
        nights:
          type: integer
        revenue:
          type: number
        cleaningFee:
          type: ["number", "null"]
        balanceDue:
          type: ["number", "null"]
        paymentStatus:
          type: string
          enum: [pending, partial, paid]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]
      required:
        - guestName
        - platform
        - propertyId
        - checkIn
        - checkOut
        - nights
        - revenue
        - paymentStatus
        - status

    ReservationUpdate:
      type: object
      properties:
        guestName:
          type: string
        platform:
          type: string
          enum: [airbnb, booking_com, direct]
        propertyId:
          type: integer
        checkIn:
          type: string
        checkOut:
          type: string
        nights:
          type: integer
        revenue:
          type: number
        cleaningFee:
          type: ["number", "null"]
        balanceDue:
          type: ["number", "null"]
        paymentStatus:
          type: string
          enum: [pending, partial, paid]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]

    CleaningTask:
      type: object
      properties:
        id:
          type: integer
        propertyId:
          type: integer
        propertyName:
          type: ["string", "null"]
        reservationId:
          type: ["integer", "null"]
        assignedToId:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        status:
          type: string
          enum: [dirty, assigned, in_progress, ready_for_inspection, approved]
        scheduledDate:
          type: string
        completedAt:
          type: ["string", "null"]
        checklist:
          type: ["object", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - propertyId
        - status
        - scheduledDate
        - createdAt

    CleaningTaskInput:
      type: object
      properties:
        propertyId:
          type: integer
        reservationId:
          type: ["integer", "null"]
        assignedToId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [dirty, assigned, in_progress, ready_for_inspection, approved]
        scheduledDate:
          type: string
        notes:
          type: ["string", "null"]
        checklist:
          type: ["object", "null"]
      required:
        - propertyId
        - scheduledDate

    CleaningTaskUpdate:
      type: object
      properties:
        assignedToId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [dirty, assigned, in_progress, ready_for_inspection, approved]
        scheduledDate:
          type: string
        notes:
          type: ["string", "null"]
        checklist:
          type: ["object", "null"]
        completedAt:
          type: ["string", "null"]

    MaintenanceTicket:
      type: object
      properties:
        id:
          type: integer
        propertyId:
          type: integer
        propertyName:
          type: ["string", "null"]
        issue:
          type: string
        priority:
          type: string
          enum: [low, medium, high, emergency]
        assignedToId:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        cost:
          type: ["number", "null"]
        chargeType:
          type: ["string", "null"]
          enum: [owner, guest, company, null]
        status:
          type: string
          enum: [reported, assigned, in_progress, waiting_parts, completed]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
      required:
        - id
        - propertyId
        - issue
        - priority
        - status
        - createdAt

    MaintenanceTicketInput:
      type: object
      properties:
        propertyId:
          type: integer
        issue:
          type: string
        priority:
          type: string
          enum: [low, medium, high, emergency]
